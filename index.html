<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM/NS INDIA – Observation Closure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--red:#E31837;--red-h:#C1121F;--s50:#F8FAFC;--s100:#F1F5F9;--s200:#E2E8F0;--s400:#94A3B8;--s600:#475569;--s800:#1E293B;--green:#10B981;--amber:#F59E0B;--r:14px;--sh:0 4px 6px -1px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:linear-gradient(135deg,#0F172A,#1E293B);min-height:100vh;padding:clamp(8px,3vw,28px);display:flex;justify-content:center;color:var(--s800)}
.wrap{width:100%;max-width:980px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 40px -10px rgba(0,0,0,.35);align-self:flex-start}
header{background:var(--red);color:#fff;padding:20px 24px}
header h1{font-size:19px;letter-spacing:.2px}header p{font-size:13px;opacity:.92;margin-top:3px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:16px 24px;background:var(--s50);border-bottom:1px solid var(--s200)}
.meta div{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--s600)}.meta b{display:block;font-size:14px;color:var(--s800);text-transform:none;letter-spacing:0;margin-top:2px;word-break:break-word}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--s200);padding:10px 24px;display:flex;align-items:center;gap:14px}
.bar span{font-size:13px;font-weight:600;white-space:nowrap}.track{flex:1;height:10px;background:var(--s100);border-radius:20px;overflow:hidden;border:1px solid var(--s200)}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .35s}
main{padding:18px 24px 110px;display:flex;flex-direction:column;gap:18px}
.card{border:1px solid var(--s200);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);background:#fff;transition:border-color .2s}
.card.done{border-color:#86e0bd}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,#1E293B,#334155);color:#fff;padding:10px 16px;font-size:13px}
.ch code{font-family:Consolas,monospace;font-size:12.5px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:5px}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--amber);color:#fff}.card.done .tag,.tag.ok{background:var(--green)}
.cb{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:700px){.cb{grid-template-columns:1fr}}
.col{padding:14px 16px}.col+.col{border-left:1px solid var(--s200)}@media(max-width:700px){.col+.col{border-left:0;border-top:1px solid var(--s200)}}
.lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--s600);margin-bottom:6px}
.loc{font-weight:700;font-size:14px;margin-bottom:6px}.txt{font-size:14px;line-height:1.5;white-space:pre-wrap;margin-bottom:10px}
.before{max-width:100%;max-height:190px;border-radius:8px;border:1px solid var(--s200);display:block}
textarea{width:100%;min-height:96px;resize:vertical;padding:10px 12px;border:1.5px solid var(--s200);border-radius:9px;font-size:14px;line-height:1.45}
textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(227,24,55,.12)}
.cnt{font-size:11px;color:var(--s400);text-align:right;margin-top:2px}
.btns{display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--red);background:#fff;color:var(--red);font-weight:700;font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--red);color:#fff}.btn.solid{background:var(--red);color:#fff}.btn.solid:hover{background:var(--red-h)}
.pv{display:flex;flex-wrap:wrap;gap:8px}.th{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--s200)}
.th img{width:100%;height:100%;object-fit:cover}.th button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.65);color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px}
.hint{font-size:12px;color:var(--s600)}.err{color:var(--red);font-size:12px;margin-top:6px;font-weight:600}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--s200);padding:12px clamp(10px,3vw,28px);display:flex;justify-content:center;z-index:9}
.fin{width:100%;max-width:932px;display:flex;align-items:center;gap:14px;justify-content:space-between}
#msg{font-size:13px;font-weight:600}.sub{padding:13px 26px;font-size:15px;border-radius:10px;border:0;background:var(--red);color:#fff;font-weight:800;cursor:pointer;min-width:200px}
.sub:disabled{background:var(--s400);cursor:not-allowed}
.state{padding:60px 24px;text-align:center}.state h2{margin:12px 0 6px}.state p{color:var(--s600);line-height:1.5;max-width:460px;margin:0 auto}
.big{font-size:54px}.spin{width:38px;height:38px;border:4px solid var(--s200);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.reco{background:#EFF6FF;border-left:4px solid #3B82F6;padding:9px 12px;border-radius:8px;font-size:14px;line-height:1.5;white-space:pre-wrap;margin-bottom:10px}.reco.none{background:var(--s50);border-color:var(--s200);color:var(--s400)}
.ro{background:var(--s50);padding:10px 12px;border-radius:9px;font-size:14px;white-space:pre-wrap;line-height:1.45}
#cam{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#cam video{max-width:100%;max-height:72vh;border-radius:10px}#cam .info{color:#fff;font-size:13px;font-weight:600}
</style></head><body>
<div class="wrap">
<header><h1>AM/NS INDIA — Pune Facility</h1><p>Line Observation Closure (5S / UC / UA) &nbsp;·&nbsp; <span style="opacity:.7">page v7</span></p></header>

<div id="loading" class="state"><div class="spin"></div><p style="margin-top:14px">Loading your observations…</p></div>
<div id="error" class="state hidden"><div class="big">⚠️</div><h2 id="errT">Link not valid</h2><p id="errP"></p></div>
<div id="done" class="state hidden"><div class="big">✅</div><h2>Closure submitted</h2><p id="doneP"></p></div>

<div id="app" class="hidden">
  <section class="meta" id="meta"></section>
  <div class="bar"><span id="pt">0 / 0 closed</span><div class="track"><div class="fill" id="pf"></div></div></div>
  <main id="list"></main>
  <footer><div class="fin"><div><div id="msg" class="hint">Points with a remark and an AFTER photo will be Closed; the rest stay Open. You can submit anytime.</div><div id="sv" class="hint" style="font-size:11px;margin-top:2px"></div></div><button class="sub" id="sendBtn" onclick="submitClosure()">Submit Closure</button></div></footer>
</div>
</div>

<div id="cam"><video id="camV" autoplay playsinline muted></video><div class="info" id="camI"></div>
<div style="display:flex;gap:10px"><button class="btn solid" onclick="snap()">📸 Capture</button><button class="btn" style="background:#fff" onclick="closeCam()">Done</button></div></div>

<script>
/* ===== CONFIG ===== */
const FLOW2_URL='https://default37cd273a1cec4aaea29741480ea54f.8d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/14/workflows/b4900ac6630940589af277454dd7a4f3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wqhvZdiVrogS9BaobW-5CpFR9aoxsN_IbGQSRy5jH2I';   // from the new flow's HTTP trigger
const MAX_PH=5, MIN_ACTION=5;
/* ================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search),S=qs.get('s'),T=qs.get('t');
const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
let D=null,cl={},camId=null,stream=null,restoring=false;   // cl[obsId]={action,photos:[File]}

/* ---------- IndexedDB draft (survives refresh / bad network on the shop floor) ---------- */
let dbp;const openDB=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('amns_closure',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const tx=async(m,f)=>{const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction('kv',m),r=f(t.objectStore('kv'));t.oncomplete=()=>ok(r&&r.result);t.onerror=t.onabort=()=>no(t.error)})};
const dbSet=(k,v)=>tx('readwrite',s=>s.put(v,k)),dbGet=k=>tx('readonly',s=>s.get(k)),dbDel=k=>tx('readwrite',s=>s.delete(k));
let tm;const doSave=()=>{if(restoring||!D)return Promise.resolve();return dbSet('d:'+T,Object.fromEntries(Object.entries(cl).map(([k,v])=>[k,{action:v.action,photos:v.photos.map(f=>({n:f.name,t:f.type,b:f}))}]))).then(()=>{$('sv').textContent='💾 Draft saved on this device '+new Date().toLocaleTimeString()}).catch(()=>{$('sv').textContent='⚠ Autosave failed (storage blocked/full)'})};
const saveDraft=now=>{clearTimeout(tm);if(now)return doSave();tm=setTimeout(doSave,250)};
const flushNow=()=>{clearTimeout(tm);doSave()};addEventListener('pagehide',flushNow);addEventListener('beforeunload',flushNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushNow()});

/* ---------- load ---------- */
function showErr(t,p){$('loading').classList.add('hidden');$('errT').textContent=t;$('errP').textContent=p;$('error').classList.remove('hidden')}
async function init(){
  if(!S||!T)return showErr('Link not valid','Please open this page using the button in the e-mail you received.');
  if(FLOW2_URL.startsWith('PASTE_'))return showErr('Not configured','Set FLOW2_URL at the top of response.html.');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{
    const r=await fetch(FLOW2_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'get',s:S,t:T})});
    if(r.status===404)return showErr('Link not valid','This link is invalid or has expired. Please use the latest e-mail.');
    if(!r.ok){let bd='';try{bd=(await r.text()).slice(0,300)}catch(e){}throw new Error('Server returned '+r.status+' '+bd)}
    D=await r.json();
  }catch(e){return showErr('Could not load',e.message+'. Check your network and reload.')}
  D.hasReco=(D.observations||[]).some(o=>Object.keys(o).some(k=>/^recommendedaction$/i.test(k)));
  D.observations=(D.observations||[]).map((o,i)=>({obsId:o.obsId||o.ObservationID||'',location:o.location||o.Location||'',observation:o.observation||o.Observation||'',recommendedAction:o.recommendedAction||(Object.keys(o).filter(k=>/recommend/i.test(k)).map(k=>o[k]).find(v=>v)||''),thumb:o.thumb||o.BeforeThumb||'',status:o.status||o.Status||'Open',correctiveAction:o.correctiveAction||o.CorrectiveAction||'',completedBy:o.completedBy||o.CompletedBy||'',completionDate:o.completionDate||o.CompletionDate||''}));
  if(!D.observations.length||D.observations.some(o=>!o.obsId)||new Set(D.observations.map(o=>o.obsId)).size!==D.observations.length)return showErr('Data problem','The flow returned observations without a reference ID. In LO-02, open the Select step and map each field with an expression such as item()?[\'ObservationID\'].');
  D.observations.sort((a,b)=>String(a.obsId).localeCompare(String(b.obsId)));D.observations.forEach((o,i)=>o.srNo=i+1);
  D.observations.forEach(o=>{cl[o.obsId]={action:o.correctiveAction||'',photos:[]}});
  D.allClosed=D.observations.every(o=>String(o.status).toLowerCase().startsWith('close'));
  if(!D.allClosed){try{restoring=true;const d=await dbGet('d:'+T);if(d){let n=0;for(const k in d)if(cl[k]&&!isClosedRow(D.observations.find(o=>o.obsId===k))){cl[k].action=d[k].action||'';cl[k].photos=(d[k].photos||[]).map(x=>new File([x.b],x.n,{type:x.t}));if(cl[k].action||cl[k].photos.length)n++}if(n)$('sv').textContent='♻ Your saved draft was restored ('+n+' point(s))'}}catch(e){}restoring=false}
  const first=D.observations[0];
  $('meta').innerHTML=[['Assigned to',D.assignedTo],['Observer',D.reportedBy],['Line',D.line],['Observation date',D.obsDate],['Due date',D.dueDate],['Points',D.observations.length]].map(([a,b])=>`<div>${a}<b>${esc(b||'—')}</b></div>`).join('');
  render();$('loading').classList.add('hidden');$('app').classList.remove('hidden');
  if(D.allClosed){$('sendBtn').classList.add('hidden');$('msg').textContent='All points on this link are already closed. Nothing more to submit.'}
}

/* ---------- render ---------- */
const isClosedRow=o=>!!o&&String(o.status).toLowerCase().startsWith('close');
const isDone=id=>{const c=cl[id];return c.action.trim().length>=MIN_ACTION&&c.photos.length>0};
function render(){
  $('list').innerHTML=D.observations.map(o=>{const ro=String(o.status).toLowerCase().startsWith('close');
    return `<section class="card" id="c_${o.obsId}" data-id="${o.obsId}">
    <div class="ch"><span>Point ${o.srNo||''} &nbsp;·&nbsp; Ref <code>${esc(o.obsId)}</code></span><span class="tag ${ro?'ok':''}" id="tg_${o.obsId}">${ro?'Closed':'Open'}</span></div>
    <div class="cb"><div class="col"><div class="lab">Observation</div><div class="loc">📍 ${esc(o.location)}</div><div class="txt">${esc(o.observation)}</div>
      <div class="lab">Recommended action</div><div class="reco ${o.recommendedAction?'':'none'}">${o.recommendedAction?esc(o.recommendedAction):(D.hasReco?'No recommendation given':'Register column RecommendedAction not found - add it to tblObservations and map it in LO-01')}</div>
      ${o.thumb?`<div class="lab">Before photo</div><img class="before" src="data:image/jpeg;base64,${o.thumb}" alt="Before">`:''}</div>
    <div class="col">${ro?`<div class="lab">Corrective action</div><div class="ro">${esc(o.correctiveAction)}</div><p class="hint" style="margin-top:8px">Closed by ${esc(o.completedBy||'')} on ${esc(o.completionDate||'')}</p>`:
      `<div class="lab">Corrective action taken *</div><textarea data-k="${o.obsId}" placeholder="Describe what was done to fix this point…" maxlength="1000">${esc(cl[o.obsId].action)}</textarea><div class="cnt" id="n_${o.obsId}"></div>
      <div class="lab" style="margin-top:10px">AFTER photos * <span class="hint">(max ${MAX_PH})</span></div>
      <div class="btns"><button class="btn solid" type="button" onclick="openCam('${o.obsId}')">📷 Take photo</button><button class="btn" type="button" onclick="document.getElementById('f_${o.obsId}').click()">🖼 Gallery</button>
      <input type="file" id="f_${o.obsId}" data-f="${o.obsId}" accept="image/*" multiple hidden></div><div class="pv" id="pv_${o.obsId}"></div><div class="err" id="rq_${o.obsId}"></div>`}</div></div></section>`}).join('');
  D.observations.forEach(o=>{if(!String(o.status).toLowerCase().startsWith('close')){prev(o.obsId);cnt(o.obsId)}});refresh()}
const cnt=id=>{const e=$('n_'+id);if(e)e.textContent=cl[id].action.length+' / 1000'};
function prev(id){const b=$('pv_'+id);if(!b)return;b.innerHTML='';cl[id].photos.forEach((f,i)=>{const d=document.createElement('div');d.className='th';d.innerHTML=`<img src="${URL.createObjectURL(f)}"><button type="button">✕</button>`;d.querySelector('button').onclick=()=>{cl[id].photos.splice(i,1);prev(id);refresh();saveDraft(true)};b.appendChild(d)})}
function refresh(){
  const open=D.observations.filter(o=>!String(o.status).toLowerCase().startsWith('close'));let n=0;
  open.forEach(o=>{const d=isDone(o.obsId);if(d)n++;const c=$('c_'+o.obsId);if(c){c.classList.toggle('done',d);$('tg_'+o.obsId).textContent=d?'Ready to close':'Stays Open';const q=$('rq_'+o.obsId);if(q){const k=cl[o.obsId],need=[];if(k.action.trim().length<MIN_ACTION)need.push('corrective action (min '+MIN_ACTION+' characters)');if(!k.photos.length)need.push('at least 1 AFTER photo');q.textContent=d?'':'To close this point add: '+need.join(' and ')}}});
  const tot=D.observations.length,prior=tot-open.length;$('pt').textContent=`${prior+n} / ${tot} ready to close`;$('pf').style.width=(tot?(prior+n)/tot*100:0)+'%';
  $('sendBtn').disabled=!open.length}
$('list').addEventListener('input',e=>{const k=e.target.dataset.k;if(k){cl[k].action=e.target.value;cnt(k);refresh();saveDraft()}});
$('list').addEventListener('change',e=>{const id=e.target.dataset.f;if(!id)return;[...e.target.files].forEach(f=>{if(cl[id].photos.length<MAX_PH)cl[id].photos.push(f)});e.target.value='';prev(id);refresh();saveDraft(true)});

/* ---------- camera ---------- */
async function openCam(id){if(cl[id].photos.length>=MAX_PH){alert('Maximum '+MAX_PH+' photos.');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('f_'+id).click();return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){document.getElementById('f_'+id).click();return}
  camId=id;$('camV').srcObject=stream;$('cam').style.display='flex';$('camI').textContent=`${D.observations.find(o=>o.obsId===id).obsId} — ${cl[id].photos.length}/${MAX_PH}`}
function snap(){const v=$('camV');if(!v.videoWidth||cl[camId].photos.length>=MAX_PH)return;const s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const id=camId;
  c.toBlob(b=>{cl[id].photos.push(new File([b],`cam_${Date.now()}.jpg`,{type:'image/jpeg'}));$('camI').textContent=`${id} — ${cl[id].photos.length}/${MAX_PH}`;prev(id);refresh();saveDraft(true)},'image/jpeg',.85)}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('cam').style.display='none'}

/* ---------- excel (same layout as the original, AFTER PHOTO + Corrective action filled) ---------- */
function shrink(file,max=800,q=.6){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res({data:c.toDataURL('image/jpeg',q).split(',')[1],w:c.width,h:c.height})};i.onerror=()=>res(null);i.src=e.target.result};r.readAsDataURL(file)})}
function imgSize(b64){return new Promise(res=>{const i=new Image();i.onload=()=>res({w:i.width,h:i.height});i.onerror=()=>res({w:240,h:180});i.src='data:image/jpeg;base64,'+b64})}
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
async function buildXlsx(rows){
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Sheet1');
  [6,13,12,20,38,30,18,40,40,12,34,24,22,16].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFCE4D6'}},thin={style:'thin'},med={style:'medium'};
  ws.mergeCells('A1:N1');const t=ws.getCell('A1');t.value=`AM/NS INDIA — Line Observation Status Report — ${D.line}`;t.font={name:'Arial',size:14,bold:true};t.fill=fill;t.alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=30;
  ['Sr. No','Date','Line','Location','Observation','Recommended action\n(by Observer)','Responsibility','Photos\n(BEFORE)','AFTER \nPHOTO','Status','Corrective action\ntaken','Obs ID','Observer Name','Observer SAP ID'].forEach((h,i)=>{const c=ws.getCell(2,i+1);c.value=h;c.font={name:'Arial',size:12,bold:true};c.fill=fill;c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border={top:med,bottom:med,left:thin,right:thin}});ws.getRow(2).height=47;
  const colPx=40*7+5,TW=130,TH=98;
  for(let n=0;n<rows.length;n++){const o=rows[n],r=n+3,ph=o.after,pr=Math.max(1,Math.ceil(ph.length/2)),rowPx=Math.max(110,pr*(TH+8)+8);
    [o.srNo||n+1,D.obsDate,D.line,o.locOnly,o.observation,o.reco||'',D.assignedTo,'','',o.status,o.action,o.obsId,D.reportedBy,D.sapId||''].forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;c.font={name:'Arial',size:12};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border={top:thin,bottom:thin,left:thin,right:thin}});
    ws.getCell(r,10).dataValidation={type:'list',allowBlank:true,formulae:['"Open,Closed"']};
    const hPt=Math.max(rowPx*.75,Math.ceil(Math.max(o.observation.length,o.action.length,(o.reco||'').length)/38)*16+10);ws.getRow(r).height=hPt;const actPx=hPt/.75;
    if(o.thumb){const sz=await imgSize(o.thumb),s=Math.min(TW/sz.w,TH/sz.h),id=wb.addImage({base64:o.thumb,extension:'jpeg'});ws.addImage(id,{tl:{col:7+8/colPx,row:r-1+8/actPx},ext:{width:sz.w*s,height:sz.h*s},editAs:'oneCell'})}
    ph.forEach((p,k)=>{const s=Math.min(TW/p.w,TH/p.h),w=p.w*s,h=p.h*s,x=8+(k%2)*(TW+8),y=8+Math.floor(k/2)*(TH+8),id=wb.addImage({base64:p.data,extension:'jpeg'});ws.addImage(id,{tl:{col:8+x/colPx,row:r-1+y/actPx},ext:{width:w,height:h},editAs:'oneCell'})})}
  return wb.xlsx.writeBuffer()}

/* ---------- submit ---------- */
function mailBody(rows,nClosed,nOpen){
  const td='border:1px solid #ccc;padding:6px',tr=rows.map(o=>`<tr><td style="${td};text-align:center">${o.srNo}</td><td style="${td}">${esc(o.obsId)}</td><td style="${td}">${esc(o.locOnly)}</td><td style="${td}">${esc(o.observation)}</td><td style="${td}">${esc(o.reco||'')}</td><td style="${td};font-weight:bold;color:${o.status==='Closed'?'#10B981':'#C1121F'}">${o.status}</td><td style="${td}">${esc(o.action)}</td></tr>`).join('');
  return `<div style="font-family:Arial,sans-serif;font-size:14px;color:#1E293B"><p>Dear ${esc(D.reportedBy)},</p>
  <p><b>${esc(D.assignedTo)}</b> has updated the observations raised on <b>${esc(D.obsDate)}</b> on <b>${esc(D.line)}</b>: <b style="color:#10B981">${nClosed} closed</b>${nOpen?`, <b style="color:#C1121F">${nOpen} still open</b>`:''}. Corrective action and AFTER photos are in the attached Excel.</p>
  <table style="border-collapse:collapse;font-size:13px"><tr style="background:#FCE4D6"><th style="${td}">Sr.</th><th style="${td}">Ref ID</th><th style="${td}">Location</th><th style="${td}">Observation</th><th style="${td}">Recommended action</th><th style="${td}">Status</th><th style="${td}">Corrective action</th></tr>${tr}</table>
  <p style="font-size:12px;color:#475569">Updated on ${today()}. ${nOpen?'Open points will be submitted later through the same link. ':''}Please verify on site and update the Register (Verified By / Verification Date).</p><p>Regards,<br>${esc(D.assignedTo)}<br>AM/NS INDIA</p></div>`}
async function submitClosure(){
  const btn=$('sendBtn'),m=$('msg');
  const open=D.observations.filter(o=>!isClosedRow(o)),ready=open.filter(o=>isDone(o.obsId)),stay=open.filter(o=>!isDone(o.obsId));
  let q=ready.length?`${ready.length} point(s) will be CLOSED.`:'No point has both a remark and an AFTER photo, so nothing will be closed.';
  if(stay.length)q+=`\n${stay.length} point(s) will stay OPEN (Point ${stay.map(o=>o.srNo).join(', ')}) - you can finish them later with the same link.`;
  if(!confirm(q+'\n\nSend the status mail to the observer?'))return;
  btn.disabled=true;
  try{
    if(typeof ExcelJS==='undefined')throw new Error('Excel library not loaded (check internet).');
    await doSave();
    m.style.color='#F59E0B';m.textContent='⏳ Processing photos…';
    const rows=[];
    for(const o of D.observations){
      const i=String(o.location).indexOf(' - '),base={obsId:o.obsId,srNo:o.srNo,observation:o.observation,reco:o.recommendedAction,locOnly:i>-1?o.location.slice(i+3):o.location,thumb:o.thumb};
      if(isClosedRow(o)){rows.push({...base,status:'Closed',action:o.correctiveAction||'',after:[],closing:false});continue}
      const c=cl[o.obsId];
      if(isDone(o.obsId)){const after=[];for(const f of c.photos){const p=await shrink(f);if(p)after.push(p)}if(!after.length)throw new Error('Point '+o.srNo+': the photo could not be processed. Use Take photo, or JPG/PNG images.');rows.push({...base,status:'Closed',action:c.action.trim(),after,closing:true})}
      else rows.push({...base,status:'Open',action:c.action.trim(),after:[],closing:false})}
    m.textContent='⏳ Building updated Excel…';
    const xl=b64(await buildXlsx(rows)),closing=rows.filter(r=>r.closing),nClosed=rows.filter(r=>r.status==='Closed').length,nOpen=rows.length-nClosed;
    const payload={action:'close',s:S,t:T,closedBy:D.assignedTo,closedOn:today(),
      closures:closing.map(r=>({obsId:r.obsId,correctiveAction:r.action,photos:r.after.map((p,k)=>({fileName:`${r.obsId}_AFTER_${k+1}.jpg`,contentBase64:p.data}))})),
      subject:nOpen?`[PARTIAL – ${nOpen} open] Line Observation – ${nClosed} of ${rows.length} closed by ${D.assignedTo} – ${D.line}`:`[CLOSED] Line Observation – ${rows.length} point(s) closed by ${D.assignedTo} – ${D.line}`,
      bodyHtml:mailBody(rows,nClosed,nOpen),attachments:[{name:'__XL__',content:xl},...closing.flatMap(r=>r.after.map((p,k)=>({name:`${r.obsId}_AFTER_${k+1}.jpg`,content:p.data})))],fileName:`Line_Observation_${nOpen?'STATUS':'CLOSED'}_${D.assignedTo.replace(/ /g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`,excelBase64:xl};payload.attachments[0].name=payload.fileName;
    m.textContent='⏳ Sending…';
    const r=await fetch(FLOW2_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    if(!r.ok){let bd='';try{bd=(await r.text()).slice(0,400)}catch(e){}throw new Error('Server returned '+r.status+' '+bd)}
    let warn='';if(closing.length){try{await new Promise(r=>setTimeout(r,3000));const v=await fetch(FLOW2_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'get',s:S,t:T})});if(v.ok){const vd=await v.json(),st={};(vd.observations||[]).forEach(z=>st[z.obsId||z.ObservationID]=String(z.status||z.Status||''));const bad=closing.filter(x=>!st[x.obsId].toLowerCase().startsWith('close'));if(bad.length)warn=`<br><br><b style="color:#C1121F">Note: the register still shows ${bad.length} point(s) as Open. The mail was sent, but the Update a row step in LO-02 did not change Status. Please check LO-02 run history.</b>`}}catch(e){}}
    closing.forEach(x=>{cl[x.obsId]={action:'',photos:[]};const o=D.observations.find(z=>z.obsId===x.obsId);if(o){o.status='Closed';o.correctiveAction=x.action}});await doSave();
    $('app').classList.add('hidden');
    $('doneP').innerHTML=`${closing.length} point(s) closed now${nOpen?`, <b>${nOpen} still open</b>`:''}. The updated Excel has been e-mailed to ${esc(D.reportedBy)}.`+warn+(nOpen?`<br><br><button class="btn solid" onclick="location.reload()">Continue with remaining points</button>`:'');
    $('done').classList.remove('hidden');scrollTo(0,0);
  }catch(e){console.error(e);m.style.color='#E31837';m.textContent='✕ '+e.message+' — your entries are saved on this device, tap Submit again.';btn.disabled=false}}
init();
</script></body></html>
